<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I'm Here 👻💜</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:"Comic Sans MS", "Trebuchet MS", sans-serif;
    background:
        radial-gradient(circle at 20% 20%, #ffffff 0 3px, transparent 4px),
        radial-gradient(circle at 80% 30%, #ffffff 0 2px, transparent 3px),
        linear-gradient(135deg,#eee5ff,#ffe8f4,#e8f5ff);
    background-size:120px 120px,170px 170px,100% 100%;
}

/* Floating stars */

.star{
    position:fixed;
    color:white;
    font-size:18px;
    animation:twinkle 2s infinite ease-in-out;
    pointer-events:none;
}

.s1{top:12%;left:12%;animation-delay:.2s}
.s2{top:20%;right:14%;animation-delay:1s}
.s3{bottom:18%;left:18%;animation-delay:.5s}
.s4{bottom:12%;right:20%;animation-delay:1.4s}

@keyframes twinkle{
    0%,100%{opacity:.3;transform:scale(.7)}
    50%{opacity:1;transform:scale(1.3)}
}

/* Main card */

.card{
    width:min(92%,430px);
    min-height:500px;
    position:relative;
    padding:35px 25px;
    text-align:center;
    border-radius:35px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(12px);
    box-shadow:0 20px 60px rgba(100,70,130,.2);
    border:2px solid rgba(255,255,255,.8);
    overflow:hidden;
}

h1{
    margin:0;
    color:#79558f;
    font-size:28px;
}

.subtitle{
    margin-top:8px;
    color:#9b7ba9;
    font-size:14px;
}

/* Ghost */

.ghost-area{
    height:230px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.ghost{
    width:130px;
    height:145px;
    position:relative;
    background:#fff;
    border-radius:65px 65px 35px 35px;
    box-shadow:0 15px 30px rgba(100,70,130,.18);
    animation:float 3s ease-in-out infinite;
}

.ghost:before,
.ghost:after{
    content:"";
    position:absolute;
    bottom:-12px;
    width:35px;
    height:25px;
    background:#fff;
    border-radius:0 0 25px 25px;
}

.ghost:before{
    left:20px;
}

.ghost:after{
    right:20px;
}

.eye{
    position:absolute;
    top:48px;
    width:17px;
    height:22px;
    background:#594866;
    border-radius:50%;
}

.eye.left{left:35px}
.eye.right{right:35px}

.mouth{
    position:absolute;
    top:78px;
    left:50%;
    transform:translateX(-50%);
    font-size:25px;
}

@keyframes float{
    0%,100%{transform:translateY(0) rotate(-2deg)}
    50%{transform:translateY(-15px) rotate(2deg)}
}

/* Message */

.message{
    min-height:60px;
    color:#684f79;
    font-size:20px;
    font-weight:bold;
    animation:pop .4s ease;
}

@keyframes pop{
    from{
        opacity:0;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* Button */

button{
    border:none;
    padding:15px 30px;
    border-radius:50px;
    background:linear-gradient(135deg,#b991d4,#e69bc5);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(150,100,170,.25);
    transition:.25s;
}

button:hover{
    transform:scale(1.08);
}

button:active{
    transform:scale(.94);
}

/* Side hint */

.hint{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    width:105px;
    padding:12px 9px;
    background:rgba(255,255,255,.8);
    border-radius:18px;
    font-size:12px;
    color:#80648e;
    box-shadow:0 8px 20px rgba(120,80,140,.12);
    animation:wiggle 4s infinite;
}

.hint:before{
    content:"";
    position:absolute;
    left:-10px;
    top:35%;
    border-width:7px 10px 7px 0;
    border-style:solid;
    border-color:transparent rgba(255,255,255,.8) transparent transparent;
}

@keyframes wiggle{
    0%,90%,100%{transform:translateY(-50%) rotate(0)}
    93%{transform:translateY(-50%) rotate(4deg)}
    96%{transform:translateY(-50%) rotate(-4deg)}
}

/* Tiny hearts */

.heart{
    position:fixed;
    pointer-events:none;
    animation:heartFloat 2s ease-out forwards;
    font-size:20px;
}

@keyframes heartFloat{
    0%{
        opacity:1;
        transform:translateY(0) scale(1);
    }
    100%{
        opacity:0;
        transform:translateY(-100px) scale(1.5);
    }
}

/* Mobile */

@media(max-width:600px){
    .card{
        min-height:520px;
    }

    .hint{
        right:4px;
        width:85px;
        font-size:10px;
    }

    .ghost{
        transform:scale(.9);
    }
}
</style>
</head>

<body>

<div class="star s1">✦</div>
<div class="star s2">✧</div>
<div class="star s3">✦</div>
<div class="star s4">✧</div>

<div class="card">

    <h1>Wait... 👀</h1>

    <div class="subtitle">
        Someone left something here...
    </div>

    <div class="ghost-area">

        <div class="ghost">

            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="mouth" id="mouth">◡</div>

        </div>

    </div>

    <div class="message" id="message">
        I'm here. 👻
    </div>

    <br>

    <button onclick="nextMessage()">
        I'm here? 👀
    </button>

    <div class="hint" id="hint">
        🤫 Psst...<br>
        I'm everywhere.
    </div>

</div>

<script>

const moments = [

    {
        message:"I'm here. 👻",
        mouth:"◡",
        hint:"🤫 Psst...<br>I'm everywhere."
    },

    {
        message:"Still here. 😌",
        mouth:"ᴗ",
        hint:"👀 You clicked again?<br>I knew you would."
    },

    {
        message:"Surprise! 🥺",
        mouth:"o",
        hint:"🫣 Okay...<br>don't look behind you."
    },

    {
        message:"Hehe... found me! 😝",
        mouth:"3",
        hint:"👻 I'm basically<br>following you now."
    },

    {
        message:"I'm hiding... 👀",
        mouth:"•ᴗ•",
        hint:"🔎 Look carefully...<br>I'm somewhere."
    },

    {
        message:"BOO! 😂👻",
        mouth:"O",
        hint:"😈 Did I scare you?<br>...just a little?"
    },

    {
        message:"Okay okay... I'm still here. 🥹",
        mouth:"︶",
        hint:"💜 You can't get rid of me."
    },

    {
        message:"Because... I'm your tiny ghost. 👻💜",
        mouth:"♡",
        hint:"✨ Wherever you go...<br>I'll say hi."
    }

];

let index = 0;

function nextMessage(){

    index++;

    if(index >= moments.length){
        index = 0;
    }

    const item = moments[index];

    const message = document.getElementById("message");
    const mouth = document.getElementById("mouth");
    const hint = document.getElementById("hint");

    message.style.animation="none";
    void message.offsetWidth;

    message.innerHTML=item.message;
    mouth.innerHTML=item.mouth;
    hint.innerHTML=item.hint;

    message.style.animation="pop .4s ease";

    createHearts();

    /* Little button text changes */

    const button=document.querySelector("button");

    const buttons=[
        "I'm here? 👀",
        "Again? 😏",
        "Who's there? 🥺",
        "Okay... 😂",
        "Find me 🔎",
        "BOO! 👻",
        "Still here? 💜",
        "One more time? ✨"
    ];

    button.innerHTML=buttons[index];

}

function createHearts(){

    for(let i=0;i<5;i++){

        const heart=document.createElement("div");

        heart.className="heart";

        heart.innerHTML=["💜","✨","💕","👻","🌸"][Math.floor(Math.random()*5)];

        heart.style.left=(40+Math.random()*20)+"%";
        heart.style.top=(45+Math.random()*15)+"%";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },2000);
    }
}

</script>

</body>
</html>
